<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 20px; font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #101827, #24466d);
        }
        .form-card {
            width: 100%; max-width: 420px; padding: 32px; background: #fff;
            border-radius: 16px; box-shadow: 0 18px 45px rgba(0,0,0,.25);
        }
        h1 { margin-bottom: 8px; color: #17243a; text-align: center; font-size: 28px; }
        .subtitle { margin-bottom: 24px; color: #6b7280; text-align: center; font-size: 14px; }
        label { display: block; margin: 16px 0 7px; color: #263247; font-weight: 600; font-size: 14px; }
        input {
            width: 100%; padding: 12px 13px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        input:focus { border-color: #3867e8; box-shadow: 0 0 0 3px rgba(56,103,232,.12); }
        button {
            width: 100%; margin-top: 24px; padding: 13px; border: none;
            border-radius: 8px; color: #fff; background: #3867e8;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #244dc0; }
        .note { margin-top: 18px; color: #6b7280; text-align: center; font-size: 12px; line-height: 1.5; }
        @media (max-width: 480px) { .form-card { padding: 24px 20px; } }
    </style>
</head>
<body>
    <main class="form-card">
        <h1>User Registration</h1>
        <p class="subtitle">Enter your details to create an account</p>
        <form action="submit.php" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username"
                   maxlength="50" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters"
                   minlength="8" autocomplete="new-password" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number"
                   pattern="[0-9]{10}" maxlength="10" minlength="10" inputmode="numeric"
                   autocomplete="tel" title="Enter a 10-digit mobile number" required>

            <button type="submit">Register</button>
        </form>
        <p class="note">Your information will be sent to the registration server.</p>
    </main>
</body>
</html>
